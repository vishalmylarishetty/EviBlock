<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EviBlock — Reset Password</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --bg2: #ffffff;
    --bg3: #f8fafc;
    --bg4: #f1f5f9;
    --border: #e2e8f0;
    --border2: #cbd5e1;
    --text: #0f172a;
    --text2: #475569;
    --text3: #64748b;
    --blue: #0284c7;
    --blue-hover: #0369a1;
    --blue-bg: #f0f9ff;
    --blue-border: #bae6fd;
    --green: #16a34a;
    --green-bg: #f0fdf4;
    --green-border: #bbf7d0;
    --red: #dc2626;
    --red-bg: #fef2f2;
    --red-border: #fecaca;
    --accent: #0284c7;
  }

  body {
    font-family: 'Inter', 'Manrope', sans-serif;
    background: #ffffff;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .grid-bg {
    position: fixed; inset: 0; z-index: 0;
    background-color: #ffffff;
    background-image:
      linear-gradient(rgba(2, 132, 199, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(2, 132, 199, 0.035) 1px, transparent 1px);
    background-size: 36px 36px;
  }
  .grid-bg::after {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 80% 20%, rgba(2, 132, 199, 0.07) 0%, transparent 60%);
  }

  .container {
    position: relative; z-index: 1;
    width: 100%; max-width: 440px;
    padding: 24px 20px;
  }

  .logo-wrap {
    text-align: center; margin-bottom: 24px;
  }

  .logo-icon {
    width: 56px; height: 56px;
    background: var(--blue-bg);
    border: 1px solid var(--blue-border);
    border-radius: 14px;
    display: inline-flex; align-items: center; justify-content: center;
    margin-bottom: 12px;
    box-shadow: 0 4px 12px rgba(2, 132, 199, 0.08);
  }

  .logo-icon svg { width: 28px; height: 28px; stroke: #0284c7; }

  h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; color: var(--text); }
  h1 span { color: var(--blue); }

  .tagline {
    font-size: 10px; color: var(--text3);
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 1.2px; text-transform: uppercase;
    margin-top: 6px;
  }

  .card {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    padding: 26px;
    box-shadow: 0 10px 30px -5px rgba(2, 132, 199, 0.08), 0 4px 12px -2px rgba(0, 0, 0, 0.03);
  }

  .form-group { margin-bottom: 15px; }

  label {
    display: block;
    font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1px;
    color: var(--text2);
    font-family: 'JetBrains Mono', monospace;
    margin-bottom: 6px;
  }

  input {
    width: 100%; padding: 10px 14px;
    background: #ffffff;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input::placeholder { color: #94a3b8; }
  input:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
  }

  .btn {
    width: 100%; padding: 12px;
    background: var(--blue);
    border: none; border-radius: 8px;
    color: #ffffff;
    font-family: inherit;
    font-size: 14px; font-weight: 700;
    cursor: pointer; transition: all 0.15s;
    margin-top: 6px;
  }
  .btn:hover { background: var(--blue-hover); box-shadow: 0 4px 14px rgba(2, 132, 199, 0.25); transform: translateY(-1px); }
  .btn:active { transform: scale(0.99); opacity: 0.9; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .alert {
    padding: 10px 14px; border-radius: 8px;
    font-size: 12px; margin-bottom: 14px;
    display: none; font-weight: 500;
  }
  .alert-err { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }
  .alert-ok  { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }

  .info-text {
    color: var(--text2); font-size: 12px; margin-bottom: 16px; line-height: 1.6;
  }

  .back-link {
    text-align: center; margin-top: 14px;
  }

  .back-link a {
    color: var(--blue); text-decoration: none; font-size: 12px; font-weight: 600;
    transition: color 0.12s;
  }
  .back-link a:hover { color: var(--blue-hover); text-decoration: underline; }

  /* Card header */
  .card-section-title {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 16px; padding-bottom: 14px;
    border-bottom: 1px solid #f1f5f9;
  }
  .card-section-title svg { width: 14px; height: 14px; stroke: var(--blue); fill: none; stroke-width: 2; }
  .card-section-title h2 { font-size: 16px; font-weight: 700; color: var(--text); }
</style>
</head>
<body>
<div class="grid-bg"></div>

<div class="container">
  <div class="logo-wrap">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#388bfd" stroke-width="2">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
        <path d="M2 17l10 5 10-5"/>
        <path d="M2 12l10 5 10-5"/>
      </svg>
    </div>
    <h1>Evi<span>Block</span></h1>
    <div class="tagline">Digital Evidence Management Platform</div>
  </div>

  <div class="card">
    <div class="card-section-title">
      <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
      <h2>Reset Your Password</h2>
    </div>
    
    <div class="alert alert-err" id="reset-err"></div>
    <div class="alert alert-ok" id="reset-ok"></div>
    
    <p class="info-text">Enter your new password below. Passwords must be at least 12 characters and include uppercase, lowercase, number, and symbol.</p>
    
    <div class="form-group">
      <label>New Password</label>
      <input type="password" id="new-pass" placeholder="Min 12 chars with upper/lower/number/symbol">
    </div>
    
    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="new-pass-confirm" placeholder="Re-enter your password">
    </div>
    
    <button class="btn" onclick="doResetPassword()">Reset Password</button>
    
    <div class="back-link">
      <a href="index.html">← Back to Sign In</a>
    </div>
  </div>
</div>

<script>
function getQueryParam(name) {
  const url = new URLSearchParams(window.location.search);
  return url.get(name);
}

function showAlert(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.style.display = 'block';
  if (id === 'reset-ok') setTimeout(() => window.location.href = 'index.html', 2000);
}

async function doResetPassword() {
  const email = getQueryParam('email');
  const token = getQueryParam('token');
  const password = document.getElementById('new-pass').value;
  const password_confirm = document.getElementById('new-pass-confirm').value;

  if (!email || !token) {
    showAlert('reset-err', 'Invalid reset link. Please request a new one.');
    return;
  }

  if (!password || !password_confirm) {
    showAlert('reset-err', 'Fill in all fields');
    return;
  }

  if (password !== password_confirm) {
    showAlert('reset-err', 'Passwords do not match');
    return;
  }

  if (password.length < 12) {
    showAlert('reset-err', 'Password must be at least 12 characters');
    return;
  }

  const res = await fetch('/api/auth/reset-password', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({email, token, password})
  });

  const data = await res.json();
  if (res.ok) {
    showAlert('reset-ok', 'Password reset successful! Redirecting to login...');
  } else {
    showAlert('reset-err', data.error || 'Failed to reset password');
  }
}

// Check if token and email exist
window.addEventListener('load', () => {
  const email = getQueryParam('email');
  const token = getQueryParam('token');
  
  if (!email || !token) {
    showAlert('reset-err', 'Invalid reset link. Please request a new password reset.');
    document.querySelector('.btn').disabled = true;
  }
});
</script>
</body>
</html>
